name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install Chromium for local HTML tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests without Cian requests
        run: python -m pytest tests/ -m 'not live'
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c 'from cian_parser import CianParser, list_locations; assert list_locations()'
