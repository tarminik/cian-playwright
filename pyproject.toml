[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cian-playwright"
version = "2.1.0"
description = "Parser for Cian.ru real estate listings (Playwright-based)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Mikhail", email = "tarminik@gmail.com" },
]
keywords = ["cian", "parser", "real-estate", "scraper", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "playwright>=1.64.0",
    "playwright-stealth>=2.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.urls]
Homepage = "https://github.com/tarminik/cian-playwright"
Repository = "https://github.com/tarminik/cian-playwright"
Issues = "https://github.com/tarminik/cian-playwright/issues"

[tool.pytest.ini_options]
markers = [
    "live: end-to-end tests that hit real Cian.ru (require network + chromium)",
    "slow: slow tests (newobject, extra_data with detail pages)",
]

[tool.setuptools.packages.find]
where = ["src"]
